name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '26.4.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: npm install --global npm@11.5.1

      - name: Check tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const tag = process.env.GITHUB_REF_NAME
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Tag ${tag} must match package version v${version}`)
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Set repository metadata
        run: npm pkg set repository.type=git repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Build and pack
        run: npm pack

      - name: Test installed package
        run: npm run test:package -- ./*.tgz

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.ref_name }}
          path: '*.tgz'
          if-no-files-found: error

      - name: Publish to npm
        run: npm publish ./*.tgz --access public
